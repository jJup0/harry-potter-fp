# Configuration for Harry Potter Character Faithfulness Project

scoring:
  # Backend: 'kiro'
  backend: kiro

  # Characters to exclude from all outputs (dashboard, reports, CSV)
  # The animals are also in SKIP_CHARACTERS in score.py, which stops them being
  # scored again. They need to be here as well because their score files already
  # exist and the reporting layer reads whatever is on disk.
  exclude_from_output:
    - "Albus Severus Potter"
    - "Nigel"
    - "Hedwig"
    - "Buckbeak"
    - "Fang"
    - "Fawkes"
    - "Aragog"
    - "Fluffy"
    - "Norbert"
    - "Nagini"
    - "Crookshanks"
    - "Pigwidgeon"
    - "Mrs. Norris"
    - "the Basilisk"
    - "The Sorting Hat"

  # Corpus version: bump this when corpus data changes (aliases, parsing, detection logic)
  corpus_version: 1

  # Minimum total mentions (screen_time_words + book_mentions) to score a character
  min_mentions: 10

  # Parallel scoring workers
  parallel: 10

  # LLM backend config
  llm:
    model: claude-sonnet-4.6
    timeout: 600
    temperature: 0.3
    delay_seconds: 1

# Scene segmentation parameters
segmentation:
  # For books: minimum paragraph length to include
  min_paragraph_length: 10
  # For screenplays: scene break detection keywords
  scene_break_keywords:
    - "we see"
    - "scene changes"
    - "cut to"
    - "later"
    - "meanwhile"
    - "back at"
    - "now in"
    - "exterior"
    - "interior"
